---
name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: true
          require-lockfile: true

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Pack
        id: pack
        run: |-
          TARBALL=$(pnpm pack | tail -n 1)
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT

      - name: Upload Tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: ${{ steps.pack.outputs.tarball }}

      - name: Dry Run Publish on NPM
        if: false # "github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')"
        run: pnpm publish --provenance --access public --dry-run --no-git-checks

      - name: Publish on NPM
        if: "startsWith(github.ref, 'refs/tags/')"
        run: pnpm stage publish --provenance --access public --no-git-checks

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: "github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      id-token: write
    env:
      TARBALL: ${{ needs.build.outputs.tarball }}
    steps:
      - name: Download Tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.TARBALL }}

      - name: Install PNPM
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: true
          require-lockfile: true

      - name: Publish on NPM
        if: "startsWith(github.ref, 'refs/tags/')"
        run: pnpm stage publish --provenance --access public --tag next $TARBALL
